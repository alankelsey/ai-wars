name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: git clone --depth 1 https://github.com/alankelsey/local-llm-kit /tmp/local-llm-kit

      - run: npm run codemap:check
        env:
          LOCAL_LLM_KIT: /tmp/local-llm-kit

      - run: npm run build
