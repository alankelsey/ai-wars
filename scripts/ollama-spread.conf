# Drop-in for the system ollama.service: both R9700s visible, so one big model splits across them.
# Same settings as gpu-services/systemd/ollama-card0.conf minus the card-0 pin.
# Installed by scripts/dev.sh up as /etc/systemd/system/ollama.service.d/spread.conf.
[Service]
Environment="OLLAMA_VULKAN=0"
Environment="OLLAMA_CONTEXT_LENGTH=131072"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KEEP_ALIVE=30m"
